name: 目录 ACL 验收矩阵

# 能力门禁：构建带 ACL 的镜像，**开着 CF_ENABLE_DIR_ACL** 跑六入口矩阵。
#
# 与基线门禁（build-and-e2e.yml）的分工是刻意的：
#
#   基线门禁问"开关全关时是否等同原生 CE"，所以它一个具体能力都不测；
#   这条门禁问"规则算出来之后，每个入口是否真的执行了它"。
#
# 两者缺一不可，而且必须分开跑。ACL 最容易出的问题不是算错——单元测试已经用
# 共享用例集把求解器盖住了（Python 52 项 / C 62 项）——而是**某个入口压根没走
# 校验**。那种缺陷只有把栈起起来、拿另一个用户的 token 去敲每个入口才会显形。
#
# 能力合回 dev 之后这条 workflow 跟着进 dev，作为一个"开着自己开关跑"的 job。
# 它挂了不影响基线发布：把 CF_ENABLE_DIR_ACL 留在关闭状态即可。

on:
  push:
    branches: [dev, 'feature/dir-acl**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号'
        default: '14.0.0-cf.0-dir-acl'
      server_ref:
        description: 'cloudfile-server ref（留空则用 release.yaml）'
        default: ''
      hub_ref:
        description: 'cloudfile-hub ref（留空则用 release.yaml）'
        default: ''

concurrency:
  group: acl-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acl-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      CF_VERSION: ${{ inputs.version || '14.0.0-cf.0-dir-acl' }}
      ADMIN_EMAIL: admin@cloudfile.test
      ADMIN_PASSWORD: CloudFile-CI-4417

    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker

      # runner 只有 ~14GB 可用磁盘，而构建要拉三个仓库、装完整工具链、再产出
      # 一个 GB 级镜像。先腾出空间，否则会在最后一步 no space left。
      - name: 腾出磁盘空间
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: 构建发行包
        working-directory: cloudfile-docker/build/cloudfile_14.0
        env:
          # 空值时回落到 release.yaml。能力尚未合回 dev 期间，用同名分支构建：
          # 构建脚本每个仓库只认一个 ref，所以这也是"两个未合并的能力无法一起
          # 构建"的由来——见 docs/BRANCHES.md 第一节。
          CF_SERVER_REF: ${{ inputs.server_ref }}
          CF_HUB_REF: ${{ inputs.hub_ref }}
        run: sudo -E ./cloudfile-build.sh "$CF_VERSION"

      - name: 构建 CE 14 基础镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./base-build.sh

      - name: 构建镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./docker-build.sh "$CF_VERSION"

      - name: 记录本次构建的实际来源
        run: |
          info="cloudfile-docker/build/cloudfile_14.0/seafile-server-$CF_VERSION/cloudfile-build-info.txt"
          tee -a "$GITHUB_STEP_SUMMARY" < "$info" || true

      - name: 启动（开启 CF_ENABLE_DIR_ACL）
        working-directory: cloudfile-docker/deploy/compose
        run: |
          cp .env.example .env
          # 不能用 localhost：上游 setup-seafile-mysql.py 的
          # SERVER_IP_OR_DOMAIN_REGEX = ^[^.].+\..+[^.]$ 要求主机名带点，
          # localhost 会让初始化脚本直接退出 255，而表面症状只是 Caddy 502。
          sed -i "s|^SEAFILE_SERVER_HOSTNAME=.*|SEAFILE_SERVER_HOSTNAME=127.0.0.1|" .env
          sed -i "s|^SEAFILE_SERVER_PROTOCOL=.*|SEAFILE_SERVER_PROTOCOL=https|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_EMAIL=.*|INIT_SEAFILE_ADMIN_EMAIL=$ADMIN_EMAIL|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_PASSWORD=.*|INIT_SEAFILE_ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
          sed -i "s|^CADDY_TLS=.*|CADDY_TLS=internal|" .env
          sed -i "s|^CF_ENABLE_DIR_ACL=.*|CF_ENABLE_DIR_ACL=true|" .env
          echo "CLOUDFILE_IMAGE=cloudfile/cloudfile:$CF_VERSION" >> .env
          grep '^CF_ENABLE_DIR_ACL=' .env      # 开关确实开着，别在红了之后才发现
          docker compose up -d
          docker compose ps

      # 先证明开着 ACL 也没把原生功能弄坏，再测 ACL 本身。
      #
      # 顺序是有意的：如果冒烟就挂了，矩阵的失败信息会指向一堆下游症状，
      # 排查时分不清"ACL 拦错了"还是"服务压根没起来"。
      - name: 原生功能未被破坏
        run: |
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 六入口验收矩阵
        run: |
          python3 cloudfile-docker/tests/e2e/acl_matrix.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 失败时导出日志
        if: failure()
        working-directory: cloudfile-docker/deploy/compose
        continue-on-error: true
        run: |
          if [[ ! -f .env ]]; then
            echo "栈尚未启动（构建阶段就失败了），没有容器日志可导出。"
            exit 0
          fi
          docker compose ps -a
          docker compose logs --tail 300 cloudfile || true
          docker compose exec -T cloudfile \
            tail -n 200 /opt/seafile/logs/seahub.log || true
          docker compose exec -T cloudfile \
            tail -n 200 /opt/seafile/logs/seafile.log || true

      - name: 停止
        if: always()
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose down -v || true
