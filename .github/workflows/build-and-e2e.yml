name: CloudFile baseline build & E2E

# 扩展基线的验收门禁：构建镜像，并证明**开关全关时行为与原生 Seafile CE 一致**。
#
# 这里刻意不测试任何具体能力。能力活在自己的长期分支上，带着自己的门禁
# （例如 feature/dir-acl 的 acl-e2e.yml）。这样拆的理由很实际：
#
#   - 基线能不能发布，不应该被某个能力的验收结果卡住；
#   - 某个能力挂了，也要一眼看出基线是好的；
#   - 第一次跑这条流水线时前端构建挂了，整条 job 红掉，关于能力的信息一条都
#     没拿到——两件事混在一个 job 里就是这个后果。
#
# 构建耗时较长（C + Go + 前端 npm build），所以不挂在每次 push 上。

on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号'
        default: '14.0.0-cf.0'
      server_ref:
        description: 'cloudfile-server ref（留空则用 release.yaml）'
        default: ''
      hub_ref:
        description: 'cloudfile-hub ref（留空则用 release.yaml）'
        default: ''

concurrency:
  group: baseline-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      CF_VERSION: ${{ inputs.version || '14.0.0-cf.0' }}
      ADMIN_EMAIL: admin@cloudfile.test
      ADMIN_PASSWORD: CloudFile-CI-4417

    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker

      # runner 只有 ~14GB 可用磁盘，而构建要拉三个仓库、装完整工具链、再产出
      # 一个 GB 级镜像。先腾出空间，否则会在最后一步 no space left。
      - name: 腾出磁盘空间
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: 构建发行包
        working-directory: cloudfile-docker/build/cloudfile_14.0
        env:
          CF_SERVER_REF: ${{ inputs.server_ref }}
          CF_HUB_REF: ${{ inputs.hub_ref }}
        run: |
          # runner 本身就是 ubuntu-24.04，构建脚本可以直接跑，不必再套容器。
          sudo -E ./cloudfile-build.sh "$CF_VERSION"

      - name: 构建 CE 14 基础镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./base-build.sh

      - name: 构建镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./docker-build.sh "$CF_VERSION"

      - name: 记录本次构建的实际来源
        run: |
          info="cloudfile-docker/build/cloudfile_14.0/seafile-server-$CF_VERSION/cloudfile-build-info.txt"
          # 同时写进日志：只进 step summary 的话，排查一次失败构建时还得回头
          # 翻另一个页面才能知道用的是哪些 commit。
          tee -a "$GITHUB_STEP_SUMMARY" < "$info" || true

      - name: 启动（开关全关）
        working-directory: cloudfile-docker/deploy/compose
        run: |
          cp .env.example .env
          # 不能用 localhost：上游 setup-seafile-mysql.py 的
          # SERVER_IP_OR_DOMAIN_REGEX = ^[^.].+\..+[^.]$ 要求主机名带点，
          # localhost 会让初始化脚本直接退出 255，而表面症状只是 Caddy 502。
          # 127.0.0.1 满足它，且不需要改 /etc/hosts。
          sed -i "s|^SEAFILE_SERVER_HOSTNAME=.*|SEAFILE_SERVER_HOSTNAME=127.0.0.1|" .env
          sed -i "s|^SEAFILE_SERVER_PROTOCOL=.*|SEAFILE_SERVER_PROTOCOL=https|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_EMAIL=.*|INIT_SEAFILE_ADMIN_EMAIL=$ADMIN_EMAIL|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_PASSWORD=.*|INIT_SEAFILE_ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
          sed -i "s|^CADDY_TLS=.*|CADDY_TLS=internal|" .env
          echo "CLOUDFILE_IMAGE=cloudfile/cloudfile:$CF_VERSION" >> .env
          docker compose up -d
          docker compose ps

      # ── 基线的两条验收：原生 CE 行为，以及扩展点确实存在但未启用 ──────
      # 走 https 而不是绕过 proxy：CADDY_TLS=internal 会让 Caddy 把 http 跳转到
      # 自签证书的 https，那正是内网/试用部署的正常形态。测这条路径比测一条
      # 用户不会走的路径更有价值，所以显式接受自签证书。
      - name: 原生 CE 冒烟
        run: |
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 扩展点已装好，但没有能力启用
        run: |
          python3 cloudfile-docker/tests/e2e/baseline.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 失败时导出日志
        # 构建阶段就失败时 .env 还不存在，compose 命令会因插值失败而报错，
        # 把真正的构建错误淹掉。所以先判断，再整体容错。
        if: failure()
        working-directory: cloudfile-docker/deploy/compose
        continue-on-error: true
        run: |
          if [[ ! -f .env ]]; then
            echo "栈尚未启动（构建阶段就失败了），没有容器日志可导出。"
            exit 0
          fi
          docker compose ps -a
          docker compose logs --tail 300 cloudfile || true
          docker compose exec -T cloudfile \
            tail -n 200 /opt/seafile/logs/seahub.log || true
          docker compose exec -T cloudfile \
            tail -n 200 /opt/seafile/logs/seafile.log || true

      - name: 导出镜像
        if: success()
        run: |
          docker save "cloudfile/cloudfile:$CF_VERSION" \
            | gzip -1 > "cloudfile-$CF_VERSION.tar.gz"
          ls -lh "cloudfile-$CF_VERSION.tar.gz"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cloudfile-image-${{ env.CF_VERSION }}
          path: cloudfile-*.tar.gz
          retention-days: 7

      - name: 停止
        if: always()
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose down -v || true
