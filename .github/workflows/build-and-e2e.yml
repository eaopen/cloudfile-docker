name: CloudFile build & E2E

# 构建镜像并跑目录 ACL 六入口验收矩阵。
#
# 这是 P0/P1 真正的验收门禁：单元测试证明求解器算得对，这里证明每个入口都
# **真的执行了**校验。构建耗时较长（C + Go + 前端 npm build），所以不挂在每次
# push 上，而是合并到 dev 时与手动触发时运行。
#
# 构建与 E2E 放在同一个 job：镜像有 1GB 级，拆成两个 job 之间来回传 artifact
# 花的时间比省下的还多。

on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号'
        default: '14.0.0-cf.0'
      server_ref:
        description: 'cloudfile-server ref（留空则用 release.yaml）'
        default: ''
      hub_ref:
        description: 'cloudfile-hub ref（留空则用 release.yaml）'
        default: ''

concurrency:
  group: build-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      CF_VERSION: ${{ inputs.version || '14.0.0-cf.0' }}
      ADMIN_EMAIL: admin@cloudfile.test
      ADMIN_PASSWORD: CloudFile-CI-4417

    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker

      # runner 只有 ~14GB 可用磁盘，而构建要拉三个仓库、装完整工具链、再产出
      # 一个 GB 级镜像。先腾出空间，否则会在最后一步 no space left。
      - name: 腾出磁盘空间
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: 构建发行包
        working-directory: cloudfile-docker/build/cloudfile_14.0
        env:
          CF_SERVER_REF: ${{ inputs.server_ref }}
          CF_HUB_REF: ${{ inputs.hub_ref }}
        run: |
          # runner 本身就是 ubuntu-24.04，构建脚本可以直接跑，不必再套容器。
          sudo -E ./cloudfile-build.sh "$CF_VERSION"

      - name: 构建镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./docker-build.sh "$CF_VERSION"

      - name: 记录本次构建的实际来源
        run: |
          cat "cloudfile-docker/build/cloudfile_14.0/seafile-server-$CF_VERSION/cloudfile-build-info.txt" \
            >> "$GITHUB_STEP_SUMMARY" || true

      # ── 回归一：全部开关关闭时必须与原生 CE 行为一致 ──────────────────
      - name: 启动（全部开关关闭）
        working-directory: cloudfile-docker/deploy/compose
        run: |
          cp .env.example .env
          sed -i "s|^SEAFILE_SERVER_HOSTNAME=.*|SEAFILE_SERVER_HOSTNAME=localhost|" .env
          sed -i "s|^SEAFILE_SERVER_PROTOCOL=.*|SEAFILE_SERVER_PROTOCOL=http|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_EMAIL=.*|INIT_SEAFILE_ADMIN_EMAIL=$ADMIN_EMAIL|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_PASSWORD=.*|INIT_SEAFILE_ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
          sed -i "s|^CADDY_TLS=.*|CADDY_TLS=internal|" .env
          echo "CLOUDFILE_IMAGE=cloudfile/cloudfile:$CF_VERSION" >> .env
          docker compose up -d
          docker compose ps

      - name: 原生 CE 冒烟（开关全关）
        run: |
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url http://localhost \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 确认 ACL 关闭时不生效
        run: |
          set -e
          token=$(curl -s -X POST http://localhost/api2/auth-token/ \
                  -d "username=$ADMIN_EMAIL&password=$ADMIN_PASSWORD" \
                  | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 -H "Authorization: Token $token" \
                 "http://localhost/api/v2.1/cloudfile/features/")
          echo "features endpoint: $code"
          # 开关全关时 dir-acl 接口应当 404
          repo=$(curl -s -H "Authorization: Token $token" \
                 -X POST http://localhost/api2/repos/ -d 'name=off-check' \
                 | python3 -c 'import sys,json; print(json.load(sys.stdin)["repo_id"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 -H "Authorization: Token $token" \
                 "http://localhost/api/v2.1/cloudfile/repos/$repo/dir-acl/?path=/")
          echo "dir-acl endpoint with switch off: $code"
          test "$code" = "404"

      # ── 回归二：打开目录 ACL，跑六入口矩阵 ────────────────────────────
      - name: 打开目录 ACL 并重启
        working-directory: cloudfile-docker/deploy/compose
        run: |
          sed -i "s|^CF_ENABLE_DIR_ACL=.*|CF_ENABLE_DIR_ACL=true|" .env
          docker compose up -d
          # 配置每次启动重写，重启即生效，不需要重装
          sleep 20
          docker compose exec -T cloudfile \
            grep -A3 'cloudfile' /opt/seafile/conf/seafile.conf || true

      - name: ACL 六入口验收矩阵
        run: |
          python3 cloudfile-docker/tests/e2e/acl_matrix.py \
            --url http://localhost \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 失败时导出日志
        if: failure()
        working-directory: cloudfile-docker/deploy/compose
        run: |
          docker compose ps -a
          docker compose logs --tail 300 cloudfile || true
          docker compose exec -T cloudfile \
            tail -n 200 /opt/seafile/logs/seahub.log || true
          docker compose exec -T cloudfile \
            tail -n 200 /opt/seafile/logs/seafile.log || true

      - name: 导出镜像
        if: success()
        run: |
          docker save "cloudfile/cloudfile:$CF_VERSION" \
            | gzip -1 > "cloudfile-$CF_VERSION.tar.gz"
          ls -lh "cloudfile-$CF_VERSION.tar.gz"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cloudfile-image-${{ env.CF_VERSION }}
          path: cloudfile-*.tar.gz
          retention-days: 7

      - name: 停止
        if: always()
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose down -v || true
