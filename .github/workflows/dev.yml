name: CloudFile shared/legacy regression checks

on:
  push:
    branches: [dev]

concurrency:
  group: dev-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: eaopen/cloudfile-server
          ref: dev
          path: cloudfile-server
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: eaopen/cloudfile-hub
          ref: dev
          path: cloudfile-hub
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version-file: cloudfile-server/fileserver/go.mod
          cache-dependency-path: cloudfile-server/fileserver/go.sum

      - name: Install C test dependencies
        run: |
          sudo apt-get update -qq
          # Native directory paging tests compile the real Vala objects and JSON RPC.
          sudo apt-get install -y -qq libglib2.0-dev libjansson-dev valac pkg-config

      - name: Install isolated check dependencies
        run: pip install --quiet -r cloudfile-docker/tools/check-requirements.txt

      - name: Record checked shared/legacy source combination
        run: |
          {
            echo '### Shared regression (not a V2 release certification)'
            printf -- '- Docker: `%s`\n' "$(git -C cloudfile-docker rev-parse HEAD)"
            printf -- '- Server: `%s`\n' "$(git -C cloudfile-server rev-parse HEAD)"
            printf -- '- Hub: `%s`\n' "$(git -C cloudfile-hub rev-parse HEAD)"
            echo 'For the current V2 native source-set, use the separate V2 current bundle check.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run development checks
        run: ./cloudfile-docker/tools/run-checks.sh
