name: CloudFile quick source checks

# Routine dev and PR changes must never trigger a cross-repository build,
# native compilation, DB integration or deployment. Run those separately via
# reviewed workflow_dispatch jobs when the relevant change needs them.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check changed files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '-z', 'HEAD^', 'HEAD']
          ).split(b'\0')
          for raw in changed:
              if not raw:
                  continue
              path = Path(raw.decode('utf-8'))
              if path.is_file() and path.suffix == '.py':
                  compile(path.read_bytes(), str(path), 'exec')
          PY
          while IFS= read -r path; do
            [[ ! -f "$path" ]] || bash -n "$path"
          done < <(git diff --name-only HEAD^ HEAD -- '*.sh')

      - name: Enforce current V2 ACL documentation contract
        run: python3 tests/test_v2_authorization_contract.py

      - name: Test source selection rules without building images
        run: |
          python3 -m unittest discover -s tests -p test_build_receipt.py -q
          python3 -m unittest discover -s tests -p test_current_build_policy.py -q

  # One-off, isolated acceptance of the existing Server/Hub storage PR SHAs.
  # This branch is not a production recipe and must not be merged into dev.
  storage-native-backend-proof:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/storage-native-runtime-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CF_SERVER_REF: feat/storage-stable-repo-key-20261024
      CF_HUB_REF: fix/storage-repo-key-api-20261024
      CF_DOCKER_REF: test/storage-native-runtime-20261024
      CF_BUILD_TARGET: backend
      CF_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prepare existing CE14 build base (no deployment)
        run: bash image/cloudfile_14.0/base-build.sh
      - name: Compile matched native C/Go Server and Hub backend using official receipt
        run: bash build/cloudfile_14.0/build-in-docker.sh 14.0.8-storage-proof
      - name: Assert current exact Server and Hub sources were used
        run: |
          set -euo pipefail
          test -x build/cloudfile_14.0/cloudfile-backend/fileserver/fileserver
          test -f build/cloudfile_14.0/cloudfile-backend/build-info.txt
          cat build/cloudfile_14.0/cloudfile-backend/build-info.txt
          python3 build/cloudfile_14.0/build_receipt.py verify build/cloudfile_14.0/build-receipt.json --recipe .
          find build/cloudfile_14.0/cloudfile-backend/seafile-server -type f \
            \( -name 'seaf-fsck' -o -name 'seafserv-gc' -o -name 'seaf-server' \) -print
