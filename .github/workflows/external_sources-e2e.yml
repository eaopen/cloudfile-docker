name: 外部资料源验收矩阵

on:
  push:
    branches: [dev, 'feature/external-sources**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: external-sources-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-sources-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CF_VERSION: 14.0.0-cf.0-external-sources
      ADMIN_EMAIL: admin@cloudfile.test
      ADMIN_PASSWORD: CloudFile-CI-4417

    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker

      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: 构建发行包
        working-directory: cloudfile-docker/build/cloudfile_14.0
        run: sudo -E ./cloudfile-build.sh "$CF_VERSION"

      - name: 构建 CE 14 基础镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./base-build.sh

      - name: 构建镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./docker-build.sh "$CF_VERSION"

      - name: 启动（开启 CF_ENABLE_EXTERNAL_SOURCES）
        working-directory: cloudfile-docker/deploy/compose
        run: |
          cp .env.example .env
          sed -i "s|^SEAFILE_SERVER_HOSTNAME=.*|SEAFILE_SERVER_HOSTNAME=127.0.0.1|" .env
          sed -i "s|^SEAFILE_SERVER_PROTOCOL=.*|SEAFILE_SERVER_PROTOCOL=https|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_EMAIL=.*|INIT_SEAFILE_ADMIN_EMAIL=$ADMIN_EMAIL|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_PASSWORD=.*|INIT_SEAFILE_ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
          sed -i "s|^CADDY_TLS=.*|CADDY_TLS=internal|" .env
          sed -i "s|^CF_ENABLE_EXTERNAL_SOURCES=.*|CF_ENABLE_EXTERNAL_SOURCES=true|" .env
          echo "CLOUDFILE_IMAGE=cloudfile/cloudfile:$CF_VERSION" >> .env
          grep '^CF_ENABLE_EXTERNAL_SOURCES=true$' .env
          docker compose up -d
          docker compose ps

      - name: 原生功能未被破坏
        run: |
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 准备挂载目录 fixture
        working-directory: cloudfile-docker/deploy/compose
        run: |
          docker compose exec -T cloudfile bash -c \
            "mkdir -p /shared/external/e2e/nested && printf 'CloudFile external source fixture\\n' > /shared/external/e2e/readme.txt && printf 'nested fixture\\n' > /shared/external/e2e/nested/inside.txt"

      - name: 外部资料源验收矩阵
        run: |
          python3 cloudfile-docker/tests/e2e/external_sources_matrix.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 失败时导出日志
        if: failure()
        working-directory: cloudfile-docker/deploy/compose
        continue-on-error: true
        run: |
          docker compose ps -a
          docker compose logs --tail 300 cloudfile || true
          docker compose exec -T cloudfile tail -n 200 /opt/seafile/logs/seahub.log || true

      - name: 停止
        if: always()
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose down -v || true
