name: 写入生命周期验收矩阵

# 基线扩展点的门禁，不是某个能力的。它回答的是 P0.5 唯一还没被证明的那句话：
#
#     "锁 provider 尚未实现时，假 provider 已能在所有写入口统一 veto"
#
# 为什么单元测试不够，讲清楚一次就够：C 144 项用例、Go 6 项跨语言契约、
# repo-op.c 50 个调用点的类型检查、9 个变异全部被捕获——这些证明的是
# "分发算得对、词汇表两端一致、调用点写得合法"。它们**一条都不能证明运行时
# 真的在每个入口被调用到**。目录 ACL 已经把这一课上过：62 项 C 检查和 87 项
# Python 检查全绿，而按邮箱下发的规则永远匹配不上、接口还返回 200，缺陷只在
# 把栈起起来、拿另一个用户的 token 去敲每个入口时才显形。
#
# 被测仪器是 common/cf-fileop-test.c，一个假 provider：记 journal，并拒绝任何
# 路径里含有标记组件的操作。它由 CF_FILEOP_TEST_PROVIDER 门控，默认关闭，
# 注册时打警告——它能拒绝写入、每次写入都追加文件，不属于生产部署。
#
# 为什么必须两个阶段、中间一次重启：
#
#   阶段 1（标记留空）建出后面要用的夹具，其中包括一个名字就是标记的目录和
#   文件。**只有现在能建**：拒绝一开，创建标记路径本身就会被拒，而那恰好是
#   被测操作之一。同时断言每个入口都产生了事实，且成功一次只产生一个——
#   包括并发重试和"内容没变所以没有提交"这两种不该产生事实的情况。
#
#   阶段 2（标记打开）逐入口断言拒绝、且零事实，并跑一组反向对照。对照不是
#   凑数：一个把所有写入都拒掉的 provider——或者一个坏掉的服务——会让
#   "每个入口都拒绝"平凡成立。
#
#   重启这一步本身也在被测：配置是每次启动重写的（write_cloudfile_config），
#   改了 .env 却不生效是这套部署踩过的坑。
#
# 它挂了不影响基线发布：CF_FILEOP_TEST_PROVIDER 留在关闭状态，seam 就是透传。

on:
  push:
    branches: [dev, 'feature/fileop**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号'
        default: '14.0.0-cf.0-fileop'
      server_ref:
        description: 'cloudfile-server ref（留空则用 release.yaml）'
        default: ''
      hub_ref:
        description: 'cloudfile-hub ref（留空则用 release.yaml）'
        default: ''

concurrency:
  group: fileop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fileop-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      CF_VERSION: ${{ inputs.version || '14.0.0-cf.0-fileop' }}
      ADMIN_EMAIL: admin@cloudfile.test
      ADMIN_PASSWORD: CloudFile-CI-4417
      JOURNAL: cloudfile-docker/deploy/compose/data/seafile/cf-fileop-journal.log

    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker

      - name: 腾出磁盘空间
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: 构建发行包
        working-directory: cloudfile-docker/build/cloudfile_14.0
        env:
          CF_SERVER_REF: ${{ inputs.server_ref }}
          CF_HUB_REF: ${{ inputs.hub_ref }}
        run: sudo -E ./cloudfile-build.sh "$CF_VERSION"

      - name: 构建镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./docker-build.sh "$CF_VERSION"

      - name: 记录本次构建的实际来源
        run: |
          info="cloudfile-docker/build/cloudfile_14.0/seafile-server-$CF_VERSION/cloudfile-build-info.txt"
          tee -a "$GITHUB_STEP_SUMMARY" < "$info" || true

      - name: 启动（provider 开启，标记留空 —— 观察模式）
        working-directory: cloudfile-docker/deploy/compose
        run: |
          cp .env.example .env
          sed -i "s|^SEAFILE_SERVER_HOSTNAME=.*|SEAFILE_SERVER_HOSTNAME=127.0.0.1|" .env
          sed -i "s|^SEAFILE_SERVER_PROTOCOL=.*|SEAFILE_SERVER_PROTOCOL=https|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_EMAIL=.*|INIT_SEAFILE_ADMIN_EMAIL=$ADMIN_EMAIL|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_PASSWORD=.*|INIT_SEAFILE_ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
          sed -i "s|^CADDY_TLS=.*|CADDY_TLS=internal|" .env
          sed -i "s|^CF_FILEOP_TEST_PROVIDER=.*|CF_FILEOP_TEST_PROVIDER=true|" .env
          sed -i "s|^CF_FILEOP_TEST_REFUSE_TOKEN=.*|CF_FILEOP_TEST_REFUSE_TOKEN=|" .env
          echo "CLOUDFILE_IMAGE=cloudfile/cloudfile:$CF_VERSION" >> .env
          # 开关确实开着、标记确实为空，别在红了之后才发现。
          grep '^CF_FILEOP_TEST_PROVIDER=true$' .env
          grep '^CF_FILEOP_TEST_REFUSE_TOKEN=$' .env
          docker compose up -d
          docker compose ps

      - name: provider 确实注册了（配置写进 seafile.conf 且日志有警告）
        working-directory: cloudfile-docker/deploy/compose
        run: |
          docker compose exec -T cloudfile \
            grep -n 'fileop_test_provider_enabled = true' \
            /opt/seafile/conf/seafile.conf
          # 注册时那句警告是唯一能证明 cf_ext_init 真的走到这里的证据。
          # 配置写对了但代码没注册，是完全静默的失败。
          docker compose exec -T cloudfile \
            grep -c 'fileop TEST provider is enabled' \
            /opt/seafile/logs/seafile.log

      - name: 原生功能未被破坏（provider 只观察，不该改变任何行为）
        run: |
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 阶段 1 —— 每个写入口都产生事实，成功一次只产生一个
        run: |
          python3 cloudfile-docker/tests/e2e/fileop_matrix.py --phase 1 \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD" \
            --journal "$JOURNAL" \
            --state-file "$RUNNER_TEMP/fileop-matrix-state.json"

      - name: 打开拒绝标记并重启
        working-directory: cloudfile-docker/deploy/compose
        run: |
          echo 'CF_FILEOP_TEST_REFUSE_TOKEN=cf-refuse' >> .env
          docker compose up -d --wait --wait-timeout 120 cloudfile
          # 每次启动重写配置这条本身也在被测。
          docker compose exec -T cloudfile \
            grep -n 'fileop_test_refuse_token = cf-refuse' \
            /opt/seafile/conf/seafile.conf
          docker compose ps

      - name: 阶段 2 —— 逐入口拒绝、零事实，外加反向对照
        run: |
          python3 cloudfile-docker/tests/e2e/fileop_matrix.py --phase 2 \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD" \
            --journal "$JOURNAL" \
            --state-file "$RUNNER_TEMP/fileop-matrix-state.json"

      - name: 关闭 provider 并重启，确认 seam 恢复透传
        working-directory: cloudfile-docker/deploy/compose
        run: |
          sed -i "s|^CF_FILEOP_TEST_PROVIDER=.*|CF_FILEOP_TEST_PROVIDER=false|" .env
          docker compose up -d --wait --wait-timeout 120 cloudfile
          docker compose exec -T cloudfile \
            grep -n 'fileop_test_provider_enabled = false' \
            /opt/seafile/conf/seafile.conf

      - name: 阶段 3 —— 关闭后原生冒烟不变，且不再产生任何事实
        run: |
          before=$(wc -l < "$JOURNAL")
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"
          after=$(wc -l < "$JOURNAL")
          echo "journal 行数：关闭前 $before，跑完冒烟后 $after"
          # 冒烟建库、建目录、上传、删库，全是写操作。关掉 provider 之后
          # journal 一行都不该长——这是"没有 provider 注册 = 原生 CE 行为"
          # 这条铁律在整机上的形式。
          test "$before" = "$after"

      - name: 失败时导出日志与 journal
        if: failure()
        working-directory: cloudfile-docker/deploy/compose
        continue-on-error: true
        run: |
          if [[ ! -f .env ]]; then
            echo "栈尚未启动（构建阶段就失败了），没有容器日志可导出。"
            exit 0
          fi
          docker compose ps -a
          docker compose logs --tail 300 cloudfile || true
          docker compose exec -T cloudfile \
            tail -n 200 /opt/seafile/logs/seafile.log || true
          docker compose exec -T cloudfile \
            tail -n 200 /opt/seafile/logs/seahub.log || true
          docker compose exec -T cloudfile \
            grep -n -A20 'CloudFile (generated' /opt/seafile/conf/seafile.conf || true
          echo "── journal（最后 200 行）──"
          tail -n 200 data/seafile/cf-fileop-journal.log || true

      - name: 停止
        if: always()
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose down -v || true
