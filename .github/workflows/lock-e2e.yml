name: 文件锁与签入签出验收矩阵

# 生产锁提供器的整机门禁：Hub 只创建租约，C/Go/WebDAV 的共享写入
# 生命周期负责终判。矩阵必须在开关开启时验证跨协议拒绝和 generation
# 围栏，再关闭开关验证原生 CE 透传。

on:
  push:
    branches: [dev, 'feature/file-lock**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号'
        default: '14.0.0-cf.0-lock'
      server_ref:
        description: 'cloudfile-server ref（留空则用 release.yaml）'
        default: ''
      hub_ref:
        description: 'cloudfile-hub ref（留空则用 release.yaml）'
        default: ''

concurrency:
  group: lock-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      CF_VERSION: ${{ inputs.version || '14.0.0-cf.0-lock' }}
      ADMIN_EMAIL: admin@cloudfile.test
      ADMIN_PASSWORD: CloudFile-CI-4417

    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker

      - name: 腾出磁盘空间
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: 设置 BuildKit builder
        uses: docker/setup-buildx-action@v3

      - name: 构建 CE 14 基础镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./base-build.sh

      - name: 构建发行包
        working-directory: cloudfile-docker/build/cloudfile_14.0
        env:
          CF_SERVER_REF: ${{ inputs.server_ref }}
          CF_HUB_REF: ${{ inputs.hub_ref }}
        run: ./build-in-docker.sh "$CF_VERSION"

      - name: 构建镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./docker-build.sh "$CF_VERSION"

      - name: 记录本次构建的实际来源
        run: |
          info="cloudfile-docker/build/cloudfile_14.0/seafile-server-$CF_VERSION/cloudfile-build-info.txt"
          tee -a "$GITHUB_STEP_SUMMARY" < "$info" || true

      - name: 启动生产锁提供器
        working-directory: cloudfile-docker/deploy/compose
        run: |
          cp .env.example .env
          sed -i "s|^SEAFILE_SERVER_HOSTNAME=.*|SEAFILE_SERVER_HOSTNAME=127.0.0.1|" .env
          sed -i "s|^SEAFILE_SERVER_PROTOCOL=.*|SEAFILE_SERVER_PROTOCOL=https|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_EMAIL=.*|INIT_SEAFILE_ADMIN_EMAIL=$ADMIN_EMAIL|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_PASSWORD=.*|INIT_SEAFILE_ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
          sed -i "s|^CADDY_TLS=.*|CADDY_TLS=internal|" .env
          sed -i "s|^CF_ENABLE_FILE_LOCK=.*|CF_ENABLE_FILE_LOCK=true|" .env
          sed -i "s|^CF_ENABLE_CHECKOUT=.*|CF_ENABLE_CHECKOUT=true|" .env
          echo "CLOUDFILE_IMAGE=cloudfile/cloudfile:$CF_VERSION" >> .env
          grep '^CF_ENABLE_FILE_LOCK=true$' .env
          grep '^CF_ENABLE_CHECKOUT=true$' .env
          docker compose up -d --wait --wait-timeout 120
          docker compose ps

      - name: 锁提供器确实注册
        working-directory: cloudfile-docker/deploy/compose
        run: |
          docker compose exec -T cloudfile \
            grep -n 'file_lock_enabled = true' /shared/seafile/conf/seafile.conf
          docker compose exec -T cloudfile \
            grep -c 'lease-backed file lock provider enabled' \
            /shared/seafile/logs/seafile.log

      - name: 开启锁能力不破坏原生功能
        run: |
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 锁与签入签出跨协议矩阵
        run: |
          python3 cloudfile-docker/tests/e2e/lock_matrix.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 关闭后恢复原生 CE 透传
        working-directory: cloudfile-docker/deploy/compose
        run: |
          sed -i "s|^CF_ENABLE_FILE_LOCK=.*|CF_ENABLE_FILE_LOCK=false|" .env
          sed -i "s|^CF_ENABLE_CHECKOUT=.*|CF_ENABLE_CHECKOUT=false|" .env
          docker compose up -d --wait --wait-timeout 120 cloudfile
          docker compose exec -T cloudfile \
            grep -n 'file_lock_enabled = false' /shared/seafile/conf/seafile.conf
          python3 ../../tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 失败时导出日志
        if: failure()
        working-directory: cloudfile-docker/deploy/compose
        continue-on-error: true
        run: |
          if [[ ! -f .env ]]; then
            echo "栈尚未启动，没有容器日志。"
            exit 0
          fi
          docker compose ps -a
          docker compose logs --tail 300 cloudfile || true
          docker compose exec -T cloudfile \
            tail -n 200 /shared/seafile/logs/seahub.log || true
          docker compose exec -T cloudfile \
            tail -n 200 /shared/seafile/logs/seafile.log || true

      - name: 停止
        if: always()
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose down -v || true
