name: 属性与标签验收矩阵

# CE 已含前端、Hub API 和 seafevents；这条门禁验证 CloudFile 把官方
# metadata-server、JWT、Redis 任务服务和两项开关接成了一条可用链路。
on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: metadata-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CF_VERSION: 14.0.0-cf.0-metadata
      ADMIN_EMAIL: admin@cloudfile.test
      ADMIN_PASSWORD: CloudFile-CI-4417

    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker

      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: 设置 BuildKit builder
        uses: docker/setup-buildx-action@v3

      - name: 构建 CE 14 基础镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./base-build.sh

      - name: 构建发行包
        working-directory: cloudfile-docker/build/cloudfile_14.0
        run: ./build-in-docker.sh "$CF_VERSION"

      - name: 构建镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./docker-build.sh "$CF_VERSION"

      - name: 启动属性与标签服务
        working-directory: cloudfile-docker/deploy/compose
        run: |
          cp .env.example .env
          sed -i "s|^SEAFILE_SERVER_HOSTNAME=.*|SEAFILE_SERVER_HOSTNAME=127.0.0.1|" .env
          sed -i "s|^SEAFILE_SERVER_PROTOCOL=.*|SEAFILE_SERVER_PROTOCOL=https|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_EMAIL=.*|INIT_SEAFILE_ADMIN_EMAIL=$ADMIN_EMAIL|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_PASSWORD=.*|INIT_SEAFILE_ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
          sed -i "s|^CADDY_TLS=.*|CADDY_TLS=internal|" .env
          sed -i "s|^CF_ENABLE_METADATA=.*|CF_ENABLE_METADATA=true|" .env
          sed -i "s|^CF_ENABLE_TAGS=.*|CF_ENABLE_TAGS=true|" .env
          echo "CLOUDFILE_IMAGE=cloudfile/cloudfile:$CF_VERSION" >> .env
          docker compose up -d
          docker compose --profile metadata up -d --wait --wait-timeout 150 cloudfile-metadata
          docker compose ps

      - name: 原生功能未被破坏
        run: |
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 属性与标签验收矩阵
        run: |
          python3 cloudfile-docker/tests/e2e/metadata_matrix.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 失败时导出日志
        if: failure()
        working-directory: cloudfile-docker/deploy/compose
        continue-on-error: true
        run: |
          docker compose ps -a
          docker compose logs --tail 300 cloudfile cloudfile-metadata || true
          docker compose exec -T cloudfile tail -n 200 /opt/seafile/logs/seahub.log || true
          docker compose exec -T cloudfile tail -n 200 /opt/seafile/logs/seafevents.log || true

      - name: 停止
        if: always()
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose down -v || true
