name: OnlyOffice 验收矩阵

# 能力门禁（P2-13）：构建带 OnlyOffice 的镜像，开着 CF_ENABLE_ONLYOFFICE、
# 起真实 Document Server（onlyoffice/documentserver:8.2，JWT 开）跑矩阵。
# 验证编辑页配置、convert 真实往返、回调签名拒绝与重投递不 500。
# 与基线门禁的分工同其它能力门禁：挂了不影响基线发布。
on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: office-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CF_VERSION: 14.0.0-cf.0-office
      ADMIN_EMAIL: admin@cloudfile.test
      ADMIN_PASSWORD: CloudFile-CI-4417

    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker

      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: 构建发行包
        working-directory: cloudfile-docker/build/cloudfile_14.0
        run: sudo -E ./cloudfile-build.sh "$CF_VERSION"

      - name: 构建 CE 14 基础镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./base-build.sh

      - name: 构建镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./docker-build.sh "$CF_VERSION"

      - name: 启动（开启 CF_ENABLE_ONLYOFFICE + Document Server）
        working-directory: cloudfile-docker/deploy/compose
        run: |
          cp .env.example .env
          sed -i "s|^SEAFILE_SERVER_HOSTNAME=.*|SEAFILE_SERVER_HOSTNAME=127.0.0.1|" .env
          sed -i "s|^SEAFILE_SERVER_PROTOCOL=.*|SEAFILE_SERVER_PROTOCOL=https|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_EMAIL=.*|INIT_SEAFILE_ADMIN_EMAIL=$ADMIN_EMAIL|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_PASSWORD=.*|INIT_SEAFILE_ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
          sed -i "s|^CADDY_TLS=.*|CADDY_TLS=internal|" .env
          sed -i "s|^CF_ENABLE_ONLYOFFICE=.*|CF_ENABLE_ONLYOFFICE=true|" .env
          {
            echo "CLOUDFILE_IMAGE=cloudfile/cloudfile:$CF_VERSION"
            echo "ONLYOFFICE_JWT_SECRET=CloudFile-CI-Office-4417"
          } >> .env
          grep '^CF_ENABLE_ONLYOFFICE=true$' .env   # 开关确实开着
          docker compose up -d
          docker compose --profile office up -d --wait --wait-timeout 300 onlyoffice
          docker compose ps

      - name: 原生功能未被破坏
        run: |
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: OnlyOffice 验收矩阵
        env:
          ONLYOFFICE_JWT_SECRET: CloudFile-CI-Office-4417
        run: |
          python3 cloudfile-docker/tests/e2e/office_matrix.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 失败时导出日志
        if: failure()
        working-directory: cloudfile-docker/deploy/compose
        continue-on-error: true
        run: |
          if [[ ! -f .env ]]; then
            echo "栈尚未启动（构建阶段就失败了），没有容器日志可导出。"
            exit 0
          fi
          docker compose ps -a
          docker compose logs --tail 300 cloudfile onlyoffice || true
          docker compose exec -T cloudfile \
            tail -n 200 /opt/seafile/logs/seahub.log || true
          docker compose exec -T cloudfile \
            grep -n 'ONLYOFFICE\|CF_ENABLE_ONLYOFFICE' \
            /opt/seafile/conf/seahub_settings.py || true

      - name: 停止
        if: always()
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose down -v || true
