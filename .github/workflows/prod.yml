name: CloudFile receipt build

# Explicit integration build only. Routine pushes remain static and cheap.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Isolated test image version
        default: 14.0.8-storage-test
        required: true
      server_ref:
        description: Server branch (dev by default, a PR branch for pre-merge tests)
        default: dev
        required: true
      hub_ref:
        description: Hub branch
        default: dev
        required: true

# 同一组合不重复排队：手动触发两次同 version/server_ref 时，旧构建让位给新的。
# 收据里的 SHA 是唯一构建输入，因此取消旧任务不会让产物对应到别的源码。
concurrency:
  group: cloudfile-receipt-${{ inputs.version }}-${{ inputs.server_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      server_sha: ${{ steps.plan.outputs.server_sha }}
      docker_sha: ${{ steps.plan.outputs.docker_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve all three branches exactly once
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          SERVER_REF: ${{ inputs.server_ref }}
          HUB_REF: ${{ inputs.hub_ref }}
        run: |
          python3 build/cloudfile_14.0/build_receipt.py resolve \
            --manifest release.yaml --version "$VERSION" \
            --server-ref "$SERVER_REF" --hub-ref "$HUB_REF" \
            --docker-ref "$GITHUB_REF_NAME" --output build/cloudfile_14.0/build-receipt.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open('build/cloudfile_14.0/build-receipt.json'))['lock']
          print('server_sha=' + lock['sources']['seafile-server']['ref'])
          print('docker_sha=' + lock['docker_commit'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-receipt
          path: build/cloudfile_14.0/build-receipt.json

  full:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CF_BUILD_RECEIPT: ${{ github.workspace }}/build/cloudfile_14.0/build-receipt.json
      CF_BUILD_JOBS: '2'
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.docker_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: source-receipt
          path: build/cloudfile_14.0
      - uses: actions/cache@v4
        with:
          path: build/cloudfile_14.0/.cache
          key: cf-receipt-tools-${{ runner.os }}-${{ hashFiles('release.yaml', '**/package-lock.json') }}
          restore-keys: cf-receipt-tools-${{ runner.os }}-
      - name: Prepare CE14 build image
        run: bash image/cloudfile_14.0/base-build.sh
      - name: Full C/Go/Web build and focused storage tests
        run: bash build/cloudfile_14.0/build-in-docker.sh "$VERSION"
      - name: Verify package and build isolated image
        run: bash image/cloudfile_14.0/docker-build.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-build-evidence
          path: |
            build/cloudfile_14.0/build-receipt.json
            build/cloudfile_14.0/test-results
          if-no-files-found: error

  bind-mounts:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.docker_sha }}
          path: cloudfile-docker
      - uses: actions/checkout@v4
        with:
          repository: eaopen/cloudfile-server
          ref: ${{ needs.plan.outputs.server_sha }}
          path: cloudfile-server
      - uses: actions/download-artifact@v4
        with:
          name: source-receipt
          path: cloudfile-docker/build/cloudfile_14.0
      - name: Prepare CE14 test image
        run: bash cloudfile-docker/image/cloudfile_14.0/base-build.sh
      - name: Privileged mount namespace (no deployed volumes)
        run: |
          docker run --rm --privileged --pull=never \
            -v "$PWD/cloudfile-docker:/work" -v "$PWD/cloudfile-server:/server:ro" \
            -e CF_TEST_BIND_MOUNTS=1 -w /work cloudfile-build-base:ce14-v2 \
            bash -ec 'git -C /tmp config --global --add safe.directory "*"; bash build/cloudfile_14.0/run-storage-tests.sh build/cloudfile_14.0/build-receipt.json /server'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bind-mount-evidence
          path: |
            cloudfile-docker/build/cloudfile_14.0/build-receipt.json
            cloudfile-docker/build/cloudfile_14.0/test-results
