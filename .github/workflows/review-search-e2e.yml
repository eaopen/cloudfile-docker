name: 搜索 review 验收矩阵

# P2-02 契约门禁 + P2-09 收口：名称匹配走 SeaSearch 原生路径；类型/位置/时间
# 筛选用上游参数；标签/创建人筛选需要 CF_PROVIDER_SEARCH=meilisearch（结构化
# 过滤器只有 CloudFile provider 能表达）——所以直接以 meilisearch provider 起
# 栈并手动跑一轮 cf_worker --once 回填索引（同 search-e2e.yml phase 2 的做法）。
on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: review-search-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-search-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CF_VERSION: 14.0.0-cf.0-review-search
      ADMIN_EMAIL: admin@cloudfile.test
      ADMIN_PASSWORD: CloudFile-CI-4417

    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker

      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: 设置 BuildKit builder
        uses: docker/setup-buildx-action@v3

      - name: 构建 CE 14 基础镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./base-build.sh

      - name: 构建发行包
        working-directory: cloudfile-docker/build/cloudfile_14.0
        run: ./build-in-docker.sh "$CF_VERSION"

      - name: 构建镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./docker-build.sh "$CF_VERSION"

      - name: 启动
        working-directory: cloudfile-docker/deploy/compose
        run: |
          cp .env.example .env
          sed -i "s|^SEAFILE_SERVER_HOSTNAME=.*|SEAFILE_SERVER_HOSTNAME=127.0.0.1|" .env
          sed -i "s|^SEAFILE_SERVER_PROTOCOL=.*|SEAFILE_SERVER_PROTOCOL=https|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_EMAIL=.*|INIT_SEAFILE_ADMIN_EMAIL=$ADMIN_EMAIL|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_PASSWORD=.*|INIT_SEAFILE_ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
          sed -i "s|^CADDY_TLS=.*|CADDY_TLS=internal|" .env
          sed -i "s|^CF_ENABLE_SEARCH=.*|CF_ENABLE_SEARCH=true|" .env
          sed -i "s|^CF_ENABLE_DIR_ACL=.*|CF_ENABLE_DIR_ACL=true|" .env
          {
            echo "CLOUDFILE_IMAGE=cloudfile/cloudfile:$CF_VERSION"
            echo "INIT_SS_ADMIN_USER=cf-search-admin"
            echo "INIT_SS_ADMIN_PASSWORD=CloudFile-CI-Search-4417"
            echo "CF_SEASEARCH_TOKEN=Y2Ytc2VhcmNoLWFkbWluOkNsb3VkRmlsZS1DSS1TZWFyY2gtNDQxNw=="
            echo "CF_SEASEARCH_INTERVAL=10s"
            echo "MEILI_MASTER_KEY=CloudFile-CI-Search-4417"
            echo "CF_MEILISEARCH_API_KEY=CloudFile-CI-Search-4417"
            echo "CF_SEARCH_INDEX_INTERVAL=15"
            echo "CF_PROVIDER_SEARCH=meilisearch"
          } >> .env
          docker compose up -d
          docker compose --profile search up -d --wait --wait-timeout 90 seasearch meilisearch
          docker compose ps

      - name: 原生功能未被破坏
        run: |
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 手动跑一轮索引器（回填切换前已存在的提交与标签）
        working-directory: cloudfile-docker/deploy/compose
        run: |
          docker compose exec -T cloudfile bash -c \
            '/opt/seafile/$SEAFILE_SERVER-$SEAFILE_VERSION/seahub.sh python-env python3 /opt/seafile/$SEAFILE_SERVER-$SEAFILE_VERSION/seahub/manage.py cf_worker --once'

      - name: 搜索 review 验收矩阵
        run: |
          python3 cloudfile-docker/tests/e2e/review_search_matrix.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 失败时导出日志
        if: failure()
        working-directory: cloudfile-docker/deploy/compose
        continue-on-error: true
        run: |
          docker compose ps -a
          docker compose logs --tail 300 cloudfile || true
          docker compose exec -T cloudfile tail -n 200 /opt/seafile/logs/seahub.log || true
          docker compose exec -T cloudfile tail -n 200 /opt/seafile/logs/seafile.log || true

      - name: 停止
        if: always()
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose down -v || true
