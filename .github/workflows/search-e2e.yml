name: 检索验收矩阵

# 能力门禁：构建带检索的镜像，**开着 CF_ENABLE_SEARCH** 跑三阶段矩阵。
#
# 与基线门禁（build-and-e2e.yml）的分工同 acl-e2e.yml：基线问"开关全关时是否
# 等同原生 CE"，这条问"开着开关时，两个 Pro 门是否真的被解除，且默认的
# SeaSearch 路径和可切换的 Meilisearch 路径都真的能搜到东西"。
#
# 为什么必须三个阶段、中间两次重启：
#
#   phase 1（留空 provider）证明的是 P0 唯一的新代码——两个接口的 IsProVersion
#   被换成了 IsSearchAvailable；SeaSearch 本身的索引/查询是上游代码。
#
#   phase 2（切到 meilisearch 后手动跑一轮 cf_worker --once）证明索引器不仅能
#   追新提交，也能回填切换前就存在的历史提交——index_tick() 不区分新旧，
#   backfill 和实时索引走同一条路径，所以只测回填就等于两项都测了。
#
#   phase 3（关掉 CF_ENABLE_SEARCH 后重启）证明"开关关闭=原生 CE"这条铁律在
#   反复切换之后依然成立。这也是 write_seafevents_search_config() 从"只在
#   首次安装执行"改成"每次启动都执行"这个改动本身要证明的事：seasearch_token
#   之前硬编码成占位符、enabled 无条件写 true 的旧代码，在这条矩阵第一次跑
#   起来之前根本不会露出问题——Pro 门一直挡着，配置对不对无关紧要。
#
# 它挂了不影响基线发布：把 CF_ENABLE_SEARCH 留在关闭状态即可。

on:
  push:
    branches: [dev, 'feature/search**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号'
        default: '14.0.0-cf.0-search'
      server_ref:
        description: 'cloudfile-server ref（留空则用 release.yaml）'
        default: ''
      hub_ref:
        description: 'cloudfile-hub ref（留空则用 release.yaml）'
        default: ''

concurrency:
  group: search-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      CF_VERSION: ${{ inputs.version || '14.0.0-cf.0-search' }}
      ADMIN_EMAIL: admin@cloudfile.test
      ADMIN_PASSWORD: CloudFile-CI-4417

    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker

      - name: 腾出磁盘空间
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: 构建发行包
        working-directory: cloudfile-docker/build/cloudfile_14.0
        env:
          CF_SERVER_REF: ${{ inputs.server_ref }}
          CF_HUB_REF: ${{ inputs.hub_ref }}
        run: sudo -E ./cloudfile-build.sh "$CF_VERSION"

      - name: 构建 CE 14 基础镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./base-build.sh

      - name: 构建镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./docker-build.sh "$CF_VERSION"

      - name: 记录本次构建的实际来源
        run: |
          info="cloudfile-docker/build/cloudfile_14.0/seafile-server-$CF_VERSION/cloudfile-build-info.txt"
          tee -a "$GITHUB_STEP_SUMMARY" < "$info" || true

      - name: 启动（开启 CF_ENABLE_SEARCH，留空 provider，起 SeaSearch + Meilisearch）
        working-directory: cloudfile-docker/deploy/compose
        run: |
          cp .env.example .env
          sed -i "s|^SEAFILE_SERVER_HOSTNAME=.*|SEAFILE_SERVER_HOSTNAME=127.0.0.1|" .env
          sed -i "s|^SEAFILE_SERVER_PROTOCOL=.*|SEAFILE_SERVER_PROTOCOL=https|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_EMAIL=.*|INIT_SEAFILE_ADMIN_EMAIL=$ADMIN_EMAIL|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_PASSWORD=.*|INIT_SEAFILE_ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
          sed -i "s|^CADDY_TLS=.*|CADDY_TLS=internal|" .env
          sed -i "s|^CF_ENABLE_SEARCH=.*|CF_ENABLE_SEARCH=true|" .env
          {
            echo "CLOUDFILE_IMAGE=cloudfile/cloudfile:$CF_VERSION"
            echo "INIT_SS_ADMIN_USER=cf-search-admin"
            echo "INIT_SS_ADMIN_PASSWORD=CloudFile-CI-Search-4417"
            echo "CF_SEASEARCH_TOKEN=Y2Ytc2VhcmNoLWFkbWluOkNsb3VkRmlsZS1DSS1TZWFyY2gtNDQxNw=="
            echo "CF_SEASEARCH_INTERVAL=10s"
            echo "MEILI_MASTER_KEY=CloudFile-CI-Search-4417"
            echo "CF_MEILISEARCH_API_KEY=CloudFile-CI-Search-4417"
            echo "CF_SEARCH_INDEX_INTERVAL=15"
          } >> .env
          grep '^CF_ENABLE_SEARCH=' .env    # 开关确实开着，别在红了之后才发现
          docker compose up -d
          docker compose --profile search up -d --wait --wait-timeout 90 seasearch meilisearch
          docker compose ps

      - name: 原生功能未被破坏
        run: |
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 阶段 1 —— 默认路径：留空 provider，走 SeaSearch
        run: |
          python3 cloudfile-docker/tests/e2e/search_matrix.py --phase 1 \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD" \
            --state-file "$RUNNER_TEMP/search-matrix-state.json"

      - name: 切到 CF_PROVIDER_SEARCH=meilisearch 并重启
        working-directory: cloudfile-docker/deploy/compose
        run: |
          echo 'CF_PROVIDER_SEARCH=meilisearch' >> .env
          docker compose up -d --wait --wait-timeout 120 cloudfile
          docker compose ps

      - name: 手动跑一轮索引器（不等定时，回填切换前已存在的提交）
        working-directory: cloudfile-docker/deploy/compose
        run: |
          docker compose exec -T cloudfile bash -c \
            '/opt/seafile/$SEAFILE_SERVER-$SEAFILE_VERSION/seahub.sh python-env python3 /opt/seafile/$SEAFILE_SERVER-$SEAFILE_VERSION/seahub/manage.py cf_worker --once'

      - name: 阶段 2 —— Meilisearch 路径，验证回填
        run: |
          python3 cloudfile-docker/tests/e2e/search_matrix.py --phase 2 \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD" \
            --state-file "$RUNNER_TEMP/search-matrix-state.json"

      - name: 关闭 CF_ENABLE_SEARCH 并重启，确认恢复原生行为
        working-directory: cloudfile-docker/deploy/compose
        run: |
          sed -i "s|^CF_ENABLE_SEARCH=.*|CF_ENABLE_SEARCH=false|" .env
          docker compose up -d --wait --wait-timeout 120 cloudfile
          docker compose ps

      - name: 阶段 3 —— 关闭后恢复原生 403
        run: |
          python3 cloudfile-docker/tests/e2e/search_matrix.py --phase 3 \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD" \
            --state-file "$RUNNER_TEMP/search-matrix-state.json"

      - name: 失败时导出日志
        if: failure()
        working-directory: cloudfile-docker/deploy/compose
        continue-on-error: true
        run: |
          if [[ ! -f .env ]]; then
            echo "栈尚未启动（构建阶段就失败了），没有容器日志可导出。"
            exit 0
          fi
          docker compose ps -a
          docker compose logs --tail 300 cloudfile seasearch meilisearch cf-worker || true
          docker compose exec -T cloudfile \
            tail -n 200 /opt/seafile/logs/seahub.log || true
          docker compose exec -T cloudfile \
            tail -n 200 /opt/seafile/logs/seafevents.log || true
          docker compose exec -T cloudfile \
            grep -n 'SEASEARCH\|CF_PROVIDER_SEARCH\|CF_ENABLE_SEARCH' \
            /opt/seafile/conf/seafevents.conf /opt/seafile/conf/seahub_settings.py || true

      - name: 停止
        if: always()
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose down -v || true
