name: S3/多存储验收矩阵

# 能力门禁：开着 CF_ENABLE_S3_STORAGE 起一套 local+MinIO 的多存储路由，验证
# 单一 S3 后端可用、GC/FSCK 完整遍历 S3 对象、修复模式在服务运行时被拒绝，
# 以及离线跨存储迁移（停服 -> 迁移 -> 重启）后数据读写仍然正确。
#
# 与基线门禁的分工同其它能力：基线问"开关全关时是否等同原生 CE"，这条问
# "开着开关时，S3 路径是不是真的在工作，而不只是配置解析通过"。
#
# 迁移必须停整个 cloudfile 容器，不能只杀容器内的 seaf-server/fileserver 进程：
# start.py 的 watch_controller 每 5 秒检查一次控制器，连续 4 次（20 秒）找不到
# 就会杀掉整个容器，迁移一慢就会和这个内部看门狗撞车。改成停容器、用同一份
# /shared 卷跑一次性容器做迁移，再重启——这与 tools/verify-local.sh 的
# cap_storage_run 完全一致，本地门禁存在的理由就是不要让这两处分叉。
on:
  push:
    branches: [dev, 'feature/storage**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: storage-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CF_VERSION: 14.0.0-cf.0-storage
      ADMIN_EMAIL: admin@cloudfile.test
      ADMIN_PASSWORD: CloudFile-CI-4417

    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker

      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: 设置 BuildKit builder
        uses: docker/setup-buildx-action@v3

      - name: 构建 CE 14 基础镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./base-build.sh

      - name: 构建发行包
        working-directory: cloudfile-docker/build/cloudfile_14.0
        run: ./build-in-docker.sh "$CF_VERSION"

      - name: 构建镜像
        working-directory: cloudfile-docker/image/cloudfile_14.0
        run: ./docker-build.sh "$CF_VERSION"

      - name: 启动（开启 CF_ENABLE_S3_STORAGE，local + minio 两个存储类）
        working-directory: cloudfile-docker/deploy/compose
        run: |
          cp .env.example .env
          sed -i "s|^SEAFILE_SERVER_HOSTNAME=.*|SEAFILE_SERVER_HOSTNAME=127.0.0.1|" .env
          sed -i "s|^SEAFILE_SERVER_PROTOCOL=.*|SEAFILE_SERVER_PROTOCOL=https|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_EMAIL=.*|INIT_SEAFILE_ADMIN_EMAIL=$ADMIN_EMAIL|" .env
          sed -i "s|^INIT_SEAFILE_ADMIN_PASSWORD=.*|INIT_SEAFILE_ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
          sed -i "s|^CADDY_TLS=.*|CADDY_TLS=internal|" .env
          sed -i "s|^CF_ENABLE_S3_STORAGE=.*|CF_ENABLE_S3_STORAGE=true|" .env
          {
            echo "CLOUDFILE_IMAGE=cloudfile/cloudfile:$CF_VERSION"
            echo "SEAF_SERVER_STORAGE_TYPE=multiple"
            echo "S3_COMMIT_BUCKET=cloudfile-commits"
            echo "S3_FS_BUCKET=cloudfile-fs"
            echo "S3_BLOCK_BUCKET=cloudfile-blocks"
            echo 'CF_STORAGE_CLASSES_JSON=[{"storage_id":"local","is_default":true,"commits":{"backend":"fs","dir":"/shared/seafile"},"fs":{"backend":"fs","dir":"/shared/seafile"},"blocks":{"backend":"fs","dir":"/shared/seafile"}},{"storage_id":"minio","commits":{"backend":"s3","bucket":"cloudfile-commits","host":"minio:9000","key_id":"minioadmin","key":"change-this-minio-password","use_https":false,"path_style_request":true,"max_retries":2},"fs":{"backend":"s3","bucket":"cloudfile-fs","host":"minio:9000","key_id":"minioadmin","key":"change-this-minio-password","use_https":false,"path_style_request":true,"max_retries":2},"blocks":{"backend":"s3","bucket":"cloudfile-blocks","host":"minio:9000","key_id":"minioadmin","key":"change-this-minio-password","use_https":false,"path_style_request":true,"max_retries":2}}]'
          } >> .env
          grep '^CF_ENABLE_S3_STORAGE=' .env   # 开关确实开着，别在红了之后才发现
          docker compose up -d
          docker compose --profile s3 up -d --wait --wait-timeout 90 minio-init
          docker compose ps

      - name: 原生功能未被破坏
        run: |
          python3 cloudfile-docker/tests/e2e/smoke.py \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"

      - name: 阶段 1 —— 上传并校验跨多个 block 的文件
        run: |
          python3 cloudfile-docker/tests/e2e/storage_matrix.py --phase 1 \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD" \
            --state-file /tmp/storage-matrix-state.json

      - name: GC 与 FSCK 完整遍历 S3 后端
        working-directory: cloudfile-docker/deploy/compose
        run: |
          docker compose exec -T cloudfile bash -c \
            '/opt/seafile/$SEAFILE_SERVER-$SEAFILE_VERSION/seaf-gc.sh --dry-run'
          docker compose exec -T cloudfile bash -c \
            '/opt/seafile/$SEAFILE_SERVER-$SEAFILE_VERSION/seaf-fsck.sh'

      - name: 修复模式必须先停服——服务仍在运行时应被拒绝
        working-directory: cloudfile-docker/deploy/compose
        run: |
          set +e
          out=$(docker compose exec -T cloudfile bash -c \
            '/opt/seafile/$SEAFILE_SERVER-$SEAFILE_VERSION/seaf-fsck.sh --repair' 2>&1)
          status=$?
          set -e
          echo "$out"
          if [[ $status -eq 0 ]]; then
            echo "::error::seaf-fsck.sh --repair 应在服务运行时被拒绝，却返回了 0"
            exit 1
          fi
          if [[ $out != *'stop seaf-server and fileserver'* ]]; then
            echo "::error::seaf-fsck.sh --repair 被拒绝，但错误信息不是预期的那条"
            exit 1
          fi

      - name: 离线迁移：停止整个 cloudfile 容器
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose stop cloudfile

      - name: 以一次性容器执行 seaf-storage-migrate.sh
        working-directory: cloudfile-docker/deploy/compose
        run: |
          repo_id=$(python3 -c "import json;print(json.load(open('/tmp/storage-matrix-state.json'))['repo_id'])")
          docker compose run --rm --no-deps --entrypoint bash cloudfile -c \
            "/etc/my_init.d/01_create_data_links.sh && /opt/seafile/\$SEAFILE_SERVER-\$SEAFILE_VERSION/seaf-storage-migrate.sh $repo_id minio"

      - name: 重启并等待就绪
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose up -d --wait --wait-timeout 120 cloudfile

      - name: 阶段 2 —— 迁移后读写仍然正确
        run: |
          python3 cloudfile-docker/tests/e2e/storage_matrix.py --phase 2 \
            --url https://127.0.0.1 --insecure \
            --admin "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD" \
            --state-file /tmp/storage-matrix-state.json

      - name: 迁移后 GC 与 FSCK 仍然通过
        working-directory: cloudfile-docker/deploy/compose
        run: |
          docker compose exec -T cloudfile bash -c \
            '/opt/seafile/$SEAFILE_SERVER-$SEAFILE_VERSION/seaf-gc.sh --dry-run'
          docker compose exec -T cloudfile bash -c \
            '/opt/seafile/$SEAFILE_SERVER-$SEAFILE_VERSION/seaf-fsck.sh'

      - name: 失败时导出日志
        if: failure()
        working-directory: cloudfile-docker/deploy/compose
        continue-on-error: true
        run: |
          if [[ ! -f .env ]]; then
            echo "栈尚未启动（构建阶段就失败了），没有容器日志可导出。"
            exit 0
          fi
          docker compose ps -a
          docker compose logs --tail 300 cloudfile minio || true
          docker compose exec -T cloudfile tail -n 200 /opt/seafile/logs/seahub.log || true

      - name: 停止
        if: always()
        working-directory: cloudfile-docker/deploy/compose
        run: docker compose --profile s3 down -v || true
