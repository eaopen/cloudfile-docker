name: CloudFile V2 current dev source bundle

# Run this integration snapshot only after the selected changes are ready.
# Ordinary commits and documentation edits must not trigger compilation or
# runtime test infrastructure; native builds remain separately approved.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-current-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-v2-source:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          path: cloudfile-docker
          fetch-depth: 0

      - name: Freeze current peer commits once
        shell: bash
        id: peers
        run: |
          set -euo pipefail
          server=$(git ls-remote https://github.com/eaopen/cloudfile-server.git refs/heads/dev | awk '{print $1}')
          hub=$(git ls-remote https://github.com/eaopen/cloudfile-hub.git refs/heads/dev | awk '{print $1}')
          [[ $server =~ ^[a-f0-9]{40}$ && $hub =~ ^[a-f0-9]{40}$ ]]
          echo "server_sha=$server" >> "$GITHUB_OUTPUT"
          echo "hub_sha=$hub" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: eaopen/cloudfile-server
          ref: ${{ steps.peers.outputs.server_sha }}
          path: cloudfile-server
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: eaopen/cloudfile-hub
          ref: ${{ steps.peers.outputs.hub_sha }}
          path: cloudfile-hub
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated V2 contract dependencies
        run: pip install --quiet 'pymysql>=1.1,<2' 'redis>=5,<8' 'PyJWT>=2.8,<3' 'requests>=2.31,<3' 'Django>=5.2,<5.3'

      - name: Prepare and test exact current V2 source snapshot
        env:
          SERVER_SHA: ${{ steps.peers.outputs.server_sha }}
          HUB_SHA: ${{ steps.peers.outputs.hub_sha }}
          CF_TEST_DB_PORT: '3306'
          CF_TEST_REDIS_PORT: '6379'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('cloudfile-docker/build/v2/source-set.json').read_text())
          manifest['components']['cloudfile-server']['overlay_commit'] = os.environ['SERVER_SHA']
          manifest['components']['cloudfile-hub']['overlay_commit'] = os.environ['HUB_SHA']
          Path('/tmp/current-v2-source-set.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          python3 cloudfile-docker/tools/prepare-v2-source.py \
            --workspace . --source-set /tmp/current-v2-source-set.json \
            --output /tmp/cloudfile-v2-current
          python3 cloudfile-docker/tools/check-v2-fresh.py --source /tmp/cloudfile-v2-current
          python3 -m compileall -q /tmp/cloudfile-v2-current/seahub/cloudfile_ext/v2

      - name: Record independently checkable V2 bundle
        if: always()
        shell: bash
        env:
          SERVER_SHA: ${{ steps.peers.outputs.server_sha }}
          HUB_SHA: ${{ steps.peers.outputs.hub_sha }}
        run: |
          {
            echo '### V2 current DEV source snapshot'
            echo "- Docker: `$(git -C cloudfile-docker rev-parse HEAD)`"
            echo "- Server: `$SERVER_SHA`"
            echo "- Hub: `$HUB_SHA`"
            echo 'V2 source assembly, schema and isolated contracts only; not a live Etech or native CE runtime acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-source-receipt-${{ github.run_id }}
          path: /tmp/cloudfile-v2-current/v2-source-receipt.json
          if-no-files-found: ignore
          retention-days: 14
