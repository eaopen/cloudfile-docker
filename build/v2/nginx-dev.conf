user root;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr;
    server {
        listen 80;
        client_max_body_size 0;
        location = / { return 302 __CF_CANONICAL__; }
        location = /cfile { return 308 __CF_CANONICAL__$is_args$args; }
        location = /seafile { return 308 __CF_CANONICAL__$is_args$args; }
        location ~ ^/(?:cfhttp|seafhttp)/(.*)$ {
            rewrite ^/(?:cfhttp|seafhttp)/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8082;
            # Only the loopback backend is allowed to interpret this header.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }
        location ~ ^/(?:cfile|seafile)/media/(.*)$ {
            alias /opt/cloudfile-v2/source/seahub/media/$1;
        }
        location ~ ^/(?:cfile|seafile)/assets/(.*)$ {
            alias /opt/cloudfile-v2/source/seahub/media/assets/$1;
        }
        location ~ ^/(?:cfile|seafile)/ {
            # Internal rewrite preserves the method, body and query string.
            rewrite ^/(?:cfile|seafile)/(.*)$ __CF_CANONICAL__$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }
    }
}
