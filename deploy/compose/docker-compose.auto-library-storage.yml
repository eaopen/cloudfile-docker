# New-install V2 local storage. Existing installations retain their persisted
# storage configuration unless CF_LIBRARY_STORAGE=auto is explicitly selected.
# Prepare this host directory first; Docker must not silently create an empty one.
services:
  cloudfile:
    volumes:
      - type: bind
        source: ${CF_LIBRARY_STORAGE_HOST_DIR:-./data/libraries}
        target: /shared/seafile/library-storage
        bind:
          create_host_path: false
    environment:
      CF_LIBRARY_STORAGE: ${CF_LIBRARY_STORAGE:-}
  cf-worker:
    volumes:
      - type: bind
        source: ${CF_LIBRARY_STORAGE_HOST_DIR:-./data/libraries}
        target: /shared/seafile/library-storage
        bind:
          create_host_path: false
    environment:
      CF_LIBRARY_STORAGE: ${CF_LIBRARY_STORAGE:-}
