# Optional for existing deployments; included by default for NEW deployments
# created from .env.example. Never add this to an existing .env without checking
# its current storage classes, RepoStorageId bindings, and backup inventory.
#
# One parent mount for all new libraries; server/worker share the same storage.
# No per-library bind mount, new storage class file or container restart.
# An auto-local template is NOT the fallback storage class: legacy-default
# continues to serve old libraries without an explicit RepoStorageId mapping.
services:
  cloudfile:
    volumes:
      - ${CF_LIBRARY_STORAGE_HOST_DIR:-./data/libraries}:/shared/seafile/library-storage
    environment:
      # Existing multi-storage bootstrap switch also enables local classes.
      # This does NOT configure S3, despite the historical switch name.
      CF_ENABLE_S3_STORAGE: "true"
      SEAF_SERVER_STORAGE_TYPE: multiple
      CF_STORAGE_CLASSES_JSON: >-
        [
          {"storage_id":"legacy-default","storage_name":"Existing local libraries","is_default":true,"commits":{"backend":"fs","dir":"/shared/seafile/seafile-data"},"fs":{"backend":"fs","dir":"/shared/seafile/seafile-data"},"blocks":{"backend":"fs","dir":"/shared/seafile/seafile-data"}},
          {"storage_id":"auto-local","storage_name":"New library directories","is_auto":true,"is_default":false,"commits":{"backend":"fs","dir":"/shared/seafile/library-storage"},"fs":{"backend":"fs","dir":"/shared/seafile/library-storage"},"blocks":{"backend":"fs","dir":"/shared/seafile/library-storage"}}
        ]
  cf-worker:
    volumes:
      - ${CF_LIBRARY_STORAGE_HOST_DIR:-./data/libraries}:/shared/seafile/library-storage
