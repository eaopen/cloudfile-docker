services:
  cloudfile-ingress:
    image: ${CLOUDFILE_IMAGE:-cloudfile/cloudfile:14.0.8-v0.2-rc-app}
    entrypoint: /usr/sbin/nginx
    command: ["-e", "/dev/stderr", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    read_only: true
    restart: unless-stopped
    ports:
      - "${CLOUDFILE_HTTPS_BIND:-127.0.0.1}:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CLOUDFILE_TLS_CERT:?Set the absolute certificate path}:/run/secrets/cloudfile-ingress.crt:ro
      - ${CLOUDFILE_TLS_KEY:?Set the absolute private key path}:/run/secrets/cloudfile-ingress.key:ro
    tmpfs:
      - /tmp
    networks:
      - private
networks:
  private:
    external: true
    name: ${CLOUDFILE_PRIVATE_NETWORK:-cloudfile-v02}
