# Public v0.2 Golden Path only. Upstream ports must remain private.
worker_processes 1;
pid /tmp/cloudfile-ingress.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    upstream cloudfile_backend { server cloudfile:80; }
    server {
        listen 443 ssl;
        ssl_certificate /run/secrets/cloudfile-ingress.crt;
        ssl_certificate_key /run/secrets/cloudfile-ingress.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 0;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 310s;
        proxy_buffering off;
        proxy_request_buffering off;

        location = / {
            if ($request_method !~ ^(GET|HEAD)$) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location = /accounts/login/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 403; }
            return 302 /api/v2.1/cloudfile/extensions/identity/v1/begin/;
        }
        location = /libraries/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location ~ "^/library/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/" {
            if ($request_method !~ ^(GET|HEAD)$) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location /media/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location = /api/v2.1/repos/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location ~ "^/api/v2[.]1/repos/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/dir/$" {
            if ($request_method !~ ^(GET|HEAD)$) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location = /api2/account/info/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location ~ "^/api/v2[.]1/cloudfile/extensions/identity/v1/(begin|callback|logout/return)/$" {
            if ($request_method !~ ^(GET|HEAD)$) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location = /api/v2.1/cloudfile/extensions/identity/v1/pending/ {
            if ($request_method !~ ^(GET|POST)$) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location ~ "^/api/v2[.]1/cloudfile/extensions/identity/v1/(logout|logout/idp|logout/backchannel|read-tickets|manual-upload|manual-update)/$" {
            if ($request_method != POST) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location = /api/v2.1/cloudfile/extensions/authorization/v1/delegations/ {
            if ($request_method != POST) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location = /api/v2.1/cloudfile/extensions/transfer/v1/delegated-read-tickets/ {
            if ($request_method != POST) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location = /seafhttp/cloudfile/read {
            if ($request_method !~ ^(GET|HEAD)$) { return 403; }
            proxy_pass http://cloudfile_backend;
        }
        location / { return 403; }
    }
}
