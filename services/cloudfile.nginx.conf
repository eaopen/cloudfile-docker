# CloudFile site config.
#
# Why this file exists instead of editing upstream's services/seafile.nginx.conf:
# nginx has no overlay mechanism for `location` blocks -- they must live inside
# the `server` block -- so "add a route" always means "own the file". Owning a
# copy keeps upstream's file byte-identical (upstream syncs stay conflict-free)
# at the cost of one obligation: when upstream changes seafile.nginx.conf, port
# the change here too. The image installs this file as
# /etc/nginx/sites-enabled/seafile.nginx.conf.
#
# CloudFile additions, both marked below:
#   /cfile/  -> rewrite to /seafile/   (EAP and older links use this prefix)
#   /cfhttp  -> same target as /seafhttp (CloudFile-side base URL)
# plus X-Real-IP on the two fileserver locations: the Go fileserver trusts that
# header from loopback, so it must be overwritten rather than forwarded.

server {
    listen 80;
    listen [::]:80 ipv6only=on;

    client_max_body_size 10m;



    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_read_timeout 310s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        add_header Access-Control-Allow-Origin *;
        client_max_body_size 0;
        access_log      /shared/seafile/logs/seahub.access.log seafileformat;
        error_log       /shared/seafile/logs/seahub.error.log;
    }

    # CloudFile: the application's SITE_ROOT is /seafile/, but EAP is configured
    # with /cfile as its CloudFile base URL and older links (preview paths,
    # bookmarks) still use that prefix. Rewrite it onto the canonical one --
    # proxying it verbatim reaches Django unchanged and answers 404.
    # Without this block the OAuth bootstrap and every CloudFile API call made
    # by EAP fail at the first hop against /cfile/.
    location /cfile/ {
        rewrite ^/cfile/(.*)$ /seafile/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 310s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        add_header Access-Control-Allow-Origin *;
        client_max_body_size 0;
        access_log      /shared/seafile/logs/seahub.access.log seafileformat;
        error_log       /shared/seafile/logs/seahub.error.log;
    }

    location = /cfile {
        return 301 /cfile/;
    }

    location /seafhttp {
        rewrite ^/seafhttp(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        # CloudFile: overwrite rather than forward. The Go fileserver trusts
        # X-Real-IP from loopback, so a client-supplied value must not survive.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_read_timeout  36000s;

        proxy_buffering off;
        proxy_request_buffering off;

        access_log      /shared/seafile/logs/seafhttp.access.log seafileformat;
        error_log       /shared/seafile/logs/seafhttp.error.log;
    }

    # CloudFile: /cfhttp is a first-class alias for /seafhttp.
    #
    # Two names for one endpoint, same reason as /cfile above: EAP, the local
    # agent and older links are configured against the CloudFile prefix, while
    # seahub keeps minting absolute /seafhttp URLs (derived from
    # FILE_SERVER_ROOT). Rewriting here means neither side has to be told about
    # the other.
    #
    # The prefix is stripped before proxying, exactly like /seafhttp: the Go
    # fileserver routes on the bare path (/files/..., /cf-edit/v1/...), so
    # forwarding the prefix verbatim would answer 404.
    location /cfhttp {
        rewrite ^/cfhttp(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        # Overwrite any client value: the Go fileserver trusts this header from loopback.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_read_timeout  36000s;

        proxy_buffering off;
        proxy_request_buffering off;

        access_log      /shared/seafile/logs/seafhttp.access.log seafileformat;
        error_log       /shared/seafile/logs/seafhttp.error.log;
    }

    location /seafdav {
        rewrite ^/seafdav$ /seafdav/ permanent;
    }

    location /seafdav/ {
        proxy_pass         http://127.0.0.1:8080/seafdav/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;
        proxy_read_timeout  1200s;
        client_max_body_size 0;

        access_log      /shared/seafile/logs/seafdav.access.log seafileformat;
        error_log       /shared/seafile/logs/seafdav.error.log;
    }

    location /:dir_browser {
        # Logo of WebDAV
        proxy_pass         http://127.0.0.1:8080/:dir_browser;
    }

    location /media {
        root /opt/seafile/seafile-server-latest/seahub;
    }

}
